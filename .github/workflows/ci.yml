name: CI/CD — In-The-Life

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: 🧹 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
      - name: Install deps
        run: pip install ruff mypy types-passlib pydantic-settings
      - name: Ruff lint
        run: ruff check backend/app
      - name: Ruff format
        run: ruff format --check backend/app
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm install
        run: cd frontend && npm ci
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      - name: ESLint
        run: cd frontend && npx eslint src --ext ts,tsx --max-warnings 0

  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_itl
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s
      nats:
        image: nats:2.10-alpine
        ports: ["4222:4222"]
    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost/test_itl
      REDIS_URL: redis://localhost:6379/0
      NATS_URL: nats://localhost:4222
      SECRET_KEY: test_secret_key_ci_only
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Install PostGIS
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=test_pass psql -h localhost -U test_user test_itl -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=test_pass psql -h localhost -U test_user test_itl -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=test_pass psql -h localhost -U test_user test_itl -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          PGPASSWORD=test_pass psql -h localhost -U test_user test_itl -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
      - name: Alembic migrate
        working-directory: backend
        run: alembic upgrade head
      - name: pytest
        working-directory: backend
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v --tb=short
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend

  test-frontend:
    name: ⚛️ Frontend Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build
      - name: Test
        run: cd frontend && npm test -- --run
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build & Push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      - name: Meta worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/worker
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build & Push worker
        uses: docker/build-push-action@v5
        with:
          context: backend
          target: worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Meta frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with: { version: "v1.29.0" }
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Update K8s images
        run: |
          SHA=${{ github.sha }}
          kubectl set image deployment/backend  backend=ghcr.io/${{ github.repository }}/backend:sha-${SHA:0:7}  -n in-the-life
          kubectl set image deployment/worker   worker=ghcr.io/${{ github.repository }}/worker:sha-${SHA:0:7}   -n in-the-life
          kubectl set image deployment/frontend frontend=ghcr.io/${{ github.repository }}/frontend:sha-${SHA:0:7} -n in-the-life
      - name: Wait rollout
        run: |
          kubectl rollout status deployment/backend  -n in-the-life --timeout=300s
          kubectl rollout status deployment/worker   -n in-the-life --timeout=300s
          kubectl rollout status deployment/frontend -n in-the-life --timeout=300s
      - name: Smoke test
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://in-the-life.example.com/health)
          [ "$STATUS" = "200" ] || (echo "Smoke test FAILED: $STATUS" && exit 1)
      - name: Slack success
        if: success()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"\u2705 Deployed: ${{ github.sha }}"}'
      - name: Slack failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"\u274c Deploy FAILED: ${{ github.sha }}"}'
