version: "3.9"

x-common: &common
  restart: unless-stopped
  networks: [itl-net]
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    environment:
      POSTGRES_DB: ${DB_NAME:-in_the_life}
      POSTGRES_USER: ${DB_USER:-itl_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itl_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 2g }
        reservations: { memory: 512m }

  redis:
    <<: *common
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 3

  nats:
    <<: *common
    image: nats:2.10-alpine
    command: "-js -m 8222 --max_payload=4MB"
    volumes: [nats_data:/data]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      retries: 3

  backend:
    <<: *common
    image: ghcr.io/${GITHUB_REPO}/backend:${IMAGE_TAG:-latest}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NATS_URL: nats://nats:4222
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits: { memory: 1g, cpus: "1.0" }
        reservations: { memory: 256m }

  worker:
    <<: *common
    image: ghcr.io/${GITHUB_REPO}/worker:${IMAGE_TAG:-latest}
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres/${DB_NAME}
      NATS_URL: nats://nats:4222
      MODEL_CACHE_DIR: /app/model_cache
    volumes: [model_cache:/app/model_cache]
    deploy:
      replicas: 1
      resources:
        limits: { memory: 2g, cpus: "2.0" }
        reservations: { memory: 1g }

  frontend:
    <<: *common
    image: ghcr.io/${GITHUB_REPO}/frontend:${IMAGE_TAG:-latest}
    depends_on: [backend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    <<: *common
    image: prom/prometheus:v2.49.0
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]

  grafana:
    <<: *common
    image: grafana/grafana:10.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]

volumes:
  postgres_data:
  redis_data:
  nats_data:
  model_cache:
  prometheus_data:
  grafana_data:

networks:
  itl-net:
    driver: bridge
