groups:
  - name: in-the-life
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Backend API is down"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "High 5xx error rate: {{ $value | humanize }}"

      - alert: DatabaseConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL connections high: {{ $value }}"

      - alert: EmbeddingWorkerDown
        expr: up{job="worker"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Embedding worker is down"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Memory usage > 90%: {{ $value | humanizePercentage }}"
